<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תבנית שלדת פוליגל 25×15 — מכוניות Arduino (פרויקטים 4·5·7)</title>
<style>
  /* 1:1 print template — A4 LANDSCAPE. All dimensions in real mm. */
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 297mm; height: 210mm;
    font-family: 'Rubik','Arial Hebrew',Arial,sans-serif;
    color: #111;
    position: relative;
    background: #fff;
  }
  svg { position: absolute; top: 0; left: 0; }
  .warn { position:absolute; top:2mm; left:6mm; font-size:8px; color:#b00; font-weight:700; direction:rtl; }
</style>
</head>
<body>
<div class="warn">מדפיסים בגודל אמיתי — 100% — בלי ״התאם לעמוד״!</div>

<!-- One mm-true SVG: viewBox unit = 1mm. All text middle-anchored (RTL-safe). -->
<svg width="297mm" height="210mm" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg">

  <!-- ===================== HEADER ===================== -->
  <text x="148.5" y="10" text-anchor="middle" font-size="6.5" font-weight="700">תבנית שלדה — פוליגל 25×15 ס״מ · פרויקטים 4 · 5 · 7</text>
  <text x="148.5" y="16.5" text-anchor="middle" font-size="3.6" fill="#444">מדביקים את הדף על לוח הפוליגל בנייר דבק · חותכים על הקווים השחורים · קודחים בסימוני ה-⊕ · התעלות של הפוליגל לאורך המכונית</text>

  <!-- name box (ownership) -->
  <g>
    <text x="276" y="26" text-anchor="middle" font-size="3.8" fill="#333">המכונית של:</text>
    <rect x="213" y="21" width="48" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="0.4"/>
  </g>

  <!-- ============ PLATE OUTLINE (250 x 150, clipped corners 15mm) ============
       Plate x 23.5..273.5, y 35..185. FRONT = LEFT (smaller x).
       Front axle x=68.5 · rear axle x=228.5 (45mm from each end, wheelbase 160).
       TT body 70x23, axle ~12mm from outer body end:
         front bodies x 56.5..126.5 · rear bodies x 170.5..240.5 (side bands only).
       Center lane (y 58..162) component line, front→rear:
         sensors x≈43.5 → brain 46..114 → L298N 116..159 → battery 161..271 (8xAA box 110x61). -->
  <g id="plate">
    <path d="M 53.5 35 L 258.5 35 L 273.5 50 L 273.5 170 L 258.5 185 L 53.5 185 L 38.5 170 L 38.5 50 Z"
          fill="#fdfcf7" stroke="#000" stroke-width="0.9"/>

    <!-- flute direction (free zone between rear motor band and battery) -->
    <line x1="198" y1="73.5" x2="232" y2="73.5" stroke="#9a9a9a" stroke-width="0.35" stroke-dasharray="2 1.4"/>
    <text x="215" y="70.8" text-anchor="middle" font-size="3.0" fill="#777">⇐ כיוון התעלות ⇒</text>

    <!-- FRONT arrow + rear label (bottom-front corner, clear of the camera perch) -->
    <g>
      <path d="M 44 155 l 7 -3.6 v 2.3 h 6.5 v 2.6 h -6.5 v 2.3 z" fill="#1a56a8"/>
      <text x="63" y="156.5" text-anchor="middle" font-size="3.6" font-weight="700" fill="#1a56a8">קדימה</text>
    </g>
    <text x="262" y="152" text-anchor="middle" font-size="3.2" fill="#666">אחורה</text>

    <!-- ============ 4 MOTOR FOOTPRINTS (under-deck, flush to side edges) ============ -->
    <g id="motor-RR">
      <rect x="170.5" y="35" width="70" height="23" fill="#eef3fa" stroke="#3c6db0" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>
      <line x1="228.5" y1="35" x2="228.5" y2="58" stroke="#3c6db0" stroke-width="0.55"/>
      <text x="234.5" y="55" text-anchor="middle" font-size="2.6" fill="#2a4d7e">⊙ ציר</text>
      <text x="203" y="44.5" text-anchor="middle" font-size="3.3" fill="#2a4d7e" font-weight="700">מנוע אחורי-ימין · מתחת ללוח</text>
      <text x="203" y="50" text-anchor="middle" font-size="2.8" fill="#2a4d7e">מצמידים מנוע · מסמנים דרך 2 חוריו · קודחים ⊕3.5</text>
      <text x="203" y="54.6" text-anchor="middle" font-size="2.8" fill="#2a4d7e">2 ברגי M3×30 + אומים</text>
    </g>
    <g id="motor-RL">
      <rect x="170.5" y="162" width="70" height="23" fill="#eef3fa" stroke="#3c6db0" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>
      <line x1="228.5" y1="162" x2="228.5" y2="185" stroke="#3c6db0" stroke-width="0.55"/>
      <text x="234.5" y="168.5" text-anchor="middle" font-size="2.6" fill="#2a4d7e">⊙ ציר</text>
      <text x="203" y="172.5" text-anchor="middle" font-size="3.3" fill="#2a4d7e" font-weight="700">מנוע אחורי-שמאל · מתחת ללוח</text>
      <text x="203" y="178" text-anchor="middle" font-size="2.8" fill="#2a4d7e">אותו תהליך: מסמנים דרך חורי המנוע,</text>
      <text x="203" y="182.6" text-anchor="middle" font-size="2.8" fill="#2a4d7e">קודחים ומבריגים</text>
    </g>
    <g id="motor-FR">
      <rect x="56.5" y="35" width="70" height="23" fill="#eef3fa" stroke="#3c6db0" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>
      <line x1="68.5" y1="35" x2="68.5" y2="58" stroke="#3c6db0" stroke-width="0.55"/>
      <text x="62.5" y="55" text-anchor="middle" font-size="2.6" fill="#2a4d7e">ציר ⊙</text>
      <text x="94" y="44.5" text-anchor="middle" font-size="3.3" fill="#2a4d7e" font-weight="700">מנוע קדמי-ימין · מתחת ללוח</text>
      <text x="94" y="50" text-anchor="middle" font-size="2.8" fill="#2a4d7e">הציר פונה קדימה —</text>
      <text x="94" y="54.6" text-anchor="middle" font-size="2.8" fill="#2a4d7e">בודקים כיוון לפני שמסמנים!</text>
    </g>
    <g id="motor-FL">
      <rect x="56.5" y="162" width="70" height="23" fill="#eef3fa" stroke="#3c6db0" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>
      <line x1="68.5" y1="162" x2="68.5" y2="185" stroke="#3c6db0" stroke-width="0.55"/>
      <text x="62.5" y="168.5" text-anchor="middle" font-size="2.6" fill="#2a4d7e">ציר ⊙</text>
      <text x="94" y="172.5" text-anchor="middle" font-size="3.3" fill="#2a4d7e" font-weight="700">מנוע קדמי-שמאל · מתחת ללוח</text>
      <text x="94" y="178" text-anchor="middle" font-size="2.8" fill="#2a4d7e">אותו תהליך: מסמנים דרך חורי המנוע,</text>
      <text x="94" y="182.6" text-anchor="middle" font-size="2.8" fill="#2a4d7e">קודחים ומבריגים</text>
    </g>

    <!-- ============ P4 LINE SENSORS: 2 bolt-drops at the nose, 26mm apart ============ -->
    <g id="sensors">
      <!-- the black line passes between them -->
      <rect x="38.5" y="101.5" width="17" height="17" fill="#e9e9e9" stroke="none"/>
      <text x="47.5" y="108.5" text-anchor="middle" font-size="2.4" fill="#666">הקו השחור</text>
      <text x="47.5" y="112.5" text-anchor="middle" font-size="2.4" fill="#666">עובר כאן</text>
      <g transform="translate(45,97)" stroke="#c22" fill="none"><circle r="2.2" stroke-width="0.5"/><line x1="-3" y1="0" x2="3" y2="0" stroke-width="0.4"/><line x1="0" y1="-3" x2="0" y2="3" stroke-width="0.4"/></g>
      <g transform="translate(45,123)" stroke="#c22" fill="none"><circle r="2.2" stroke-width="0.5"/><line x1="-3" y1="0" x2="3" y2="0" stroke-width="0.4"/><line x1="0" y1="-3" x2="0" y2="3" stroke-width="0.4"/></g>
      <text x="78" y="146.5" text-anchor="middle" font-size="2.8" fill="#a11">חיישני קו (פרויקט 4): קודחים ⊕3.5 · בורג M3×20 + 2 אומים כמרווח</text>
      <text x="78" y="151.1" text-anchor="middle" font-size="2.8" fill="#a11">החיישן מביט ברצפה · המרחק ביניהם 26 מ״מ — הקו עובר באמצע</text>
    </g>

    <!-- ============ BRAIN ZONE: Uno (P4) / ESP32 (P5·7), 69x54 ============ -->
    <g id="brain">
      <rect x="46" y="86" width="68" height="54" fill="#eaf7ef" stroke="#1f7a44" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>
      <text x="80" y="94.5" text-anchor="middle" font-size="3.5" font-weight="700" fill="#155c31">המוח של המכונית</text>
      <text x="80" y="100.5" text-anchor="middle" font-size="2.9" fill="#155c31">פרויקט 4: Arduino Uno · פרויקטים 5·7: ESP32</text>
      <text x="80" y="106.5" text-anchor="middle" font-size="2.8" fill="#155c31">מחברים בסקוץ׳ (צמדן) —</text>
      <text x="80" y="111.1" text-anchor="middle" font-size="2.8" fill="#155c31">מחליפים מוח בין פרויקטים!</text>
      <text x="80" y="118" text-anchor="middle" font-size="2.8" fill="#155c31">חיבור ה-USB פונה קדימה</text>
      <text x="80" y="122.6" text-anchor="middle" font-size="2.8" fill="#155c31">כדי שיהיה קל לתכנת</text>
      <text x="80" y="133" text-anchor="middle" font-size="2.6" fill="#4a7a5c">(ברגי החיישנים מסתתרים מתחת — בסדר גמור)</text>
    </g>

    <!-- ============ L298N ZONE 43x43 (x 116..159) ============ -->
    <g id="driver">
      <rect x="116" y="88.5" width="43" height="43" fill="#fdecec" stroke="#b03a3a" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>
      <text x="137.5" y="99" text-anchor="middle" font-size="3.5" font-weight="700" fill="#8c2626">בקר מנועים</text>
      <text x="137.5" y="104" text-anchor="middle" font-size="3.5" font-weight="700" fill="#8c2626">L298N</text>
      <text x="137.5" y="110" text-anchor="middle" font-size="2.8" fill="#8c2626">הצלעות לקירור למעלה</text>
      <text x="137.5" y="121" text-anchor="middle" font-size="2.8" fill="#8c2626">מסמנים דרך 4 חורי הלוח</text>
      <text x="137.5" y="125.6" text-anchor="middle" font-size="2.8" fill="#8c2626">קודחים ⊕3.5 · ברגים/אזיקונים</text>
    </g>

    <!-- ============ BATTERY: 8xAA box with switch 110x61, rear ============ -->
    <g id="battery">
      <rect x="161" y="79.5" width="110" height="61" fill="#fff7e8" stroke="#b98a1f" stroke-width="0.45" stroke-dasharray="1.6 1.2"/>
      <text x="216" y="104" text-anchor="middle" font-size="3.6" font-weight="700" fill="#8a6a14">בית סוללות 8×AA + מתג (110×61 מ״מ)</text>
      <text x="216" y="109.5" text-anchor="middle" font-size="2.9" fill="#8a6a14">מהדקים עם 2 אזיקונים דרך החריצים הירוקים</text>
      <text x="216" y="114.5" text-anchor="middle" font-size="2.9" fill="#8a6a14">המתג פונה אחורה — קל להגיע אליו</text>
      <text x="216" y="119.5" text-anchor="middle" font-size="2.9" fill="#8a6a14">החוטים יוצאים קדימה, אל הבקר</text>
      <rect x="179" y="74.5" width="12" height="4" fill="#fff" stroke="#0a7a3c" stroke-width="0.5"/>
      <rect x="179" y="141.5" width="12" height="4" fill="#fff" stroke="#0a7a3c" stroke-width="0.5"/>
      <rect x="241" y="74.5" width="12" height="4" fill="#fff" stroke="#0a7a3c" stroke-width="0.5"/>
      <rect x="241" y="141.5" width="12" height="4" fill="#fff" stroke="#0a7a3c" stroke-width="0.5"/>
    </g>

    <!-- ============ P7 CAMERA PERCH on the front edge ============ -->
    <g id="cam">
      <rect x="42" y="63" width="27" height="8" fill="#f3eefc" stroke="#6b46a8" stroke-width="0.4" stroke-dasharray="1.2 1"/>
      <text x="101" y="68.5" text-anchor="middle" font-size="2.8" fill="#4d3080">פרויקט 7: מדף המצלמה (ESP32-CAM)</text>
    </g>

    <!-- ============ WIRE PASS HOLES (flanking the L298N, clear columns) ============ -->
    <g id="wireholes">
      <circle cx="140.5" cy="72" r="4" fill="#fff" stroke="#000" stroke-width="0.55"/>
      <circle cx="140.5" cy="148" r="4" fill="#fff" stroke="#000" stroke-width="0.55"/>
      <text x="140.5" y="64.5" text-anchor="middle" font-size="2.8" fill="#333">מעבר חוטים ⌀8</text>
      <text x="140.5" y="157.5" text-anchor="middle" font-size="2.8" fill="#333">מעבר חוטים ⌀8</text>
    </g>
  </g>

  <!-- ===================== FOOTER ===================== -->
  <g id="calib">
    <rect x="23.5" y="190" width="60" height="15" fill="none" stroke="#000" stroke-width="0.5"/>
    <line x1="28.5" y1="200.5" x2="78.5" y2="200.5" stroke="#000" stroke-width="0.5"/>
    <line x1="28.5" y1="198.5" x2="28.5" y2="202.5" stroke="#000" stroke-width="0.5"/>
    <line x1="78.5" y1="198.5" x2="78.5" y2="202.5" stroke="#000" stroke-width="0.5"/>
    <text x="53.5" y="195" text-anchor="middle" font-size="3.1" font-weight="700">בדיקת קנה מידה: הקו = בדיוק 5 ס״מ</text>
    <text x="53.5" y="198.2" text-anchor="middle" font-size="2.6" fill="#555">לא 5 ס״מ? להדפיס שוב ב-100%</text>
  </g>

  <g id="legend" font-size="2.9" fill="#222">
    <line x1="178" y1="192" x2="188" y2="192" stroke="#000" stroke-width="0.9"/>
    <text x="134" y="193" text-anchor="middle">חיתוך מלא — סכין חזקה או מסורית, עם המורה</text>
    <rect x="178" y="195.4" width="10" height="3.2" fill="#fff" stroke="#0a7a3c" stroke-width="0.5"/>
    <text x="134" y="198.4" text-anchor="middle">חריץ לאזיקון 12×4 מ״מ — 2 דקירות סכין ומחברים</text>
    <g transform="translate(183,203.6)" stroke="#c22" fill="none"><circle r="1.9" stroke-width="0.5"/><line x1="-2.6" y1="0" x2="2.6" y2="0" stroke-width="0.4"/><line x1="0" y1="-2.6" x2="0" y2="2.6" stroke-width="0.4"/></g>
    <text x="134" y="204.6" text-anchor="middle">קדיחה ⌀3.5 מ״מ · מסגרות מקווקוות צבעוניות — אזורי הנחה, לא חותכים!</text>
  </g>

  <g font-size="2.9" fill="#444">
    <text x="245" y="193" text-anchor="middle">הגלגלים יושבים בחוץ, צמוד ללוח — לא צריך חורים לגלגלים</text>
    <text x="245" y="198.4" text-anchor="middle">שני קווי הרוחב חוצים את התעלות — חותכים אותם עם המורה</text>
    <text x="245" y="204.6" text-anchor="middle">4 פינות האלכסון — חיתוך אחד כל אחת, שומרות על הקירות שלכם</text>
  </g>
</svg>
</body>
</html>
