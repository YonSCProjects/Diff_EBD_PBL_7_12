<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Arial, 'Segoe UI', sans-serif">
  <rect x="2" y="2" width="756" height="326" rx="12" fill="#fafafa" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#111">Project 2 · Circuit 2 — LED + Button + Buzzer</text>
  <text x="24" y="60" font-size="13" fill="#666">Adds the piezo buzzer · pin map: LED=D9, Button=D2, Buzzer=D8</text>

  <!-- LED chain -->
  <circle cx="40" cy="100" r="6" fill="#f28a00"/>
  <text x="56" y="105" font-size="15" fill="#111"><tspan font-weight="bold">Arduino D9</tspan> ──[ 220 Ω ]── LED long leg (+) ; short leg (−) ── <tspan font-weight="bold">GND</tspan></text>

  <!-- Button chain -->
  <circle cx="40" cy="150" r="6" fill="#cc1414"/>
  <text x="56" y="155" font-size="15" fill="#111"><tspan font-weight="bold">Arduino 5 V</tspan> ── Button pin A</text>
  <circle cx="40" cy="177" r="6" fill="#f28a00"/>
  <text x="56" y="182" font-size="15" fill="#111">Button pin B ── <tspan font-weight="bold">Arduino D2</tspan>  ·  pin B ──[ 10 kΩ ]── <tspan font-weight="bold">GND</tspan></text>

  <!-- Buzzer chain -->
  <circle cx="40" cy="232" r="6" fill="#f28a00"/>
  <text x="56" y="237" font-size="15" fill="#111"><tspan font-weight="bold">Arduino D8</tspan> ── Buzzer leg 1</text>
  <circle cx="40" cy="259" r="6" fill="#000000"/>
  <text x="56" y="264" font-size="15" fill="#111">Buzzer leg 2 ── <tspan font-weight="bold">GND</tspan>  <tspan fill="#666">(small passive piezo — no resistor; drive only from D8)</tspan></text>

  <text x="24" y="316" font-size="11.5" font-style="italic" fill="#999">Schematic (preliminary). A photo-style breadboard image will replace this diagram.</text>
</svg>
