<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Arial, 'Segoe UI', sans-serif">
  <rect x="2" y="2" width="756" height="326" rx="12" fill="#fafafa" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="24" y="38" font-size="20" font-weight="bold" fill="#111">Project 2 · Circuit 4 — Two-Button Variant (Tier 3)</text>
  <text x="24" y="60" font-size="13" fill="#666">Head-to-head game · Button 1=D2, Button 2=D3, LED=D9, Buzzer=D8</text>

  <!-- LED + buzzer summary -->
  <circle cx="40" cy="100" r="6" fill="#f28a00"/>
  <text x="56" y="105" font-size="15" fill="#111"><tspan font-weight="bold">D9</tspan> ──[ 220 Ω ]── LED (+) ; short leg ── <tspan font-weight="bold">GND</tspan>   ·   <tspan font-weight="bold">D8</tspan> ── Buzzer ── <tspan font-weight="bold">GND</tspan></text>

  <!-- Button 1 -->
  <circle cx="40" cy="155" r="6" fill="#cc1414"/>
  <text x="56" y="160" font-size="15" fill="#111"><tspan font-weight="bold">Player 1:</tspan> 5 V ── Button 1 pin A ; pin B ── <tspan font-weight="bold">D2</tspan> ; pin B ──[ 10 kΩ ]── <tspan font-weight="bold">GND</tspan></text>

  <!-- Button 2 -->
  <circle cx="40" cy="210" r="6" fill="#cc1414"/>
  <text x="56" y="215" font-size="15" fill="#111"><tspan font-weight="bold">Player 2:</tspan> 5 V ── Button 2 pin A ; pin B ── <tspan font-weight="bold">D3</tspan> ; pin B ──[ 10 kΩ ]── <tspan font-weight="bold">GND</tspan></text>

  <text x="56" y="262" font-size="13" fill="#666">Each player has their own button; the sketch shows who pressed first.</text>

  <text x="24" y="316" font-size="11.5" font-style="italic" fill="#999">Schematic (preliminary). A photo-style breadboard image will replace this diagram.</text>
</svg>
